<header class="topbar"><div><div class="page-eyebrow">Control agrícola · {{ temporadaLabel }}</div><h1 class="page-title">{{ pageMeta.title }}</h1><p class="page-subtitle">{{ pageMeta.subtitle }}</p></div><div class="topbar-actions"><label class="season-control"><span>Temporada agrícola</span><select v-model="temporadaSeleccionada"><option value="TODAS">Todas las temporadas</option><option v-for="year in temporadasDisponibles" :value="year">{{ year }}–{{ Number(year) + 1 }}</option></select></label><button @click="loadServerData" class="btn btn-outline-success" :disabled="loading" title="Actualizar datos"><i class="bi bi-arrow-clockwise me-1" :class="{ spin: loading }"></i> Actualizar</button></div></header>

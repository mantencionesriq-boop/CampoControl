<section v-if="currentTab === 'panel'" class="row g-4">
  <div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold d-flex flex-wrap align-items-center justify-content-between gap-2"><span><i class="bi bi-bar-chart-fill me-1"></i> Aplicaciones, fertilizaciones y labores realizadas</span><select v-model="panelHuertoId" @change="renderDashboard" class="form-select form-select-sm panel-filter"><option value="">Todos los huertos</option><option v-for="huerto in huertos" :key="huerto.ID_Huerto" :value="huerto.ID_Huerto">{{ huerto.Nombre_Cliente }}</option></select></div><div class="card-body"><canvas id="canvasResumen" height="220" aria-label="Resumen de labores"></canvas></div></div></div>
  <div class="col-lg-4"><div class="card shadow-sm border-0 h-100"><div class="card-header bg-white fw-bold">Resumen operativo</div><div class="card-body"><p><strong>{{ aplicacionesPanel.length }}</strong> aplicaciones fitosanitarias</p><p><strong>{{ fertilizacionesRealizadas }}</strong> fertilizaciones realizadas</p><p><strong>{{ laboresRealizadas }}</strong> labores programadas completadas</p><p><strong>{{ laboresPendientes }}</strong> labores pendientes</p></div></div></div>
</section>

<section v-if="currentTab === 'cultural'" class="row g-4">
  <div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-header bg-primary text-white fw-bold"><i class="bi bi-journal-plus me-1"></i> Nueva Labor Cultural</div><div class="card-body"><form @submit.prevent="submitCultural">
    <div class="mb-3"><label class="form-label small fw-bold">Huerto / Cliente</label><select class="form-select" v-model="formCultural.ID_Huerto" required><option value="" disabled>Seleccione un huerto</option><option v-for="h in huertos" :value="h.ID_Huerto" :key="h.ID_Huerto">{{ h.Nombre_Cliente }} ({{ h.ID_Huerto }})</option></select></div>
    <div class="mb-3"><label class="form-label small fw-bold">Fecha de Ejecución</label><input type="date" class="form-control" v-model="formCultural.Fecha" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Tipo de Labor</label><select class="form-select" v-model="formCultural.Tipo_Labor" required><option v-for="labor in tiposLabor" :value="labor.Nombre">{{ labor.Nombre }}</option><option value="__OTRO__">Otro…</option></select><input v-if="formCultural.Tipo_Labor === '__OTRO__'" v-model="otroTipoCultural" class="form-control mt-2" required placeholder="Escriba el nuevo tipo de labor"></div>
    <div class="mb-3"><label class="form-label small fw-bold">Horas Invertidas</label><input type="number" step="0.5" class="form-control" v-model="formCultural.Horas_Invertidas" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Descripción Técnica</label><textarea class="form-control" rows="3" v-model="formCultural.Descripcion_Tecnica" required></textarea></div>
    <button type="submit" class="btn btn-primary w-100" :disabled="submitting"><span v-if="submitting" class="spinner-border spinner-border-sm me-1"></span>Registrar Labor</button>
  </form></div></div></div>
  <div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold"><i class="bi bi-clock-history me-1"></i> Historial de Labores Culturales</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Fecha</th><th>Huerto</th><th>Labor</th><th>Descripción</th><th>Horas</th><th></th></tr></thead><tbody><tr v-if="culturalHistorial.length === 0"><td colspan="6" class="text-center text-muted py-4">No hay labores realizadas hasta hoy.</td></tr><tr v-for="c in culturalHistorial" :key="c.ID_Labor"><td>{{ c.Fecha }}</td><td class="fw-bold">{{ getHuertoNombre(c.ID_Huerto) }}</td><td><span class="badge bg-info text-dark">{{ c.Tipo_Labor }}</span></td><td class="small">{{ c.Descripcion_Tecnica }}</td><td>{{ c.Horas_Invertidas }} hrs</td><td><button class="btn btn-sm btn-outline-secondary me-1" @click="editarCultural(c)">Editar</button><button class="btn btn-sm btn-outline-danger" @click="eliminarCultural(c.ID_Labor)">Eliminar</button></td></tr></tbody></table></div></div></div></div>
</section>

<section v-if="currentTab === 'huertos'" class="row g-4">
  <div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-header bg-success text-white fw-bold"><i class="bi bi-plus-circle me-1"></i> Registrar Huerto</div><div class="card-body">
    <form @submit.prevent="submitHuerto">
      <div class="mb-3"><label class="form-label small fw-bold">Nombre del Cliente / Proyecto</label><input type="text" class="form-control" v-model="formHuerto.Nombre_Cliente" required placeholder="Ej: Residencia Gómez"></div>
      <div class="mb-3"><label class="form-label small fw-bold">Ubicación</label><input type="text" class="form-control" v-model="formHuerto.Ubicacion" required placeholder="Ej: La Serena / Coquimbo"></div>
      <div class="row"><div class="col-6 mb-3"><label class="form-label small fw-bold">Superficie (m²)</label><input type="number" step="0.1" class="form-control" v-model="formHuerto.Superficie_m2" required></div><div class="col-6 mb-3"><label class="form-label small fw-bold">Tipo</label><select class="form-select" v-model="formHuerto.Tipo_Huerto" required><option>Urbano</option><option>Familiar</option><option>Comunitario</option></select></div></div>
      <div class="mb-3"><label class="form-label small fw-bold">Fecha de Inicio</label><input type="date" class="form-control" v-model="formHuerto.Fecha_Inicio" required></div>
      <button type="submit" class="btn btn-success w-100" :disabled="submitting"><span v-if="submitting" class="spinner-border spinner-border-sm me-1"></span>{{ formHuerto.ID_Huerto ? 'Guardar cambios' : 'Registrar huerto' }}</button>
    </form>
  </div></div></div>
  <div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold"><i class="bi bi-list-stars me-1"></i> Huertos Registrados ({{ huertos.length }})</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Cliente</th><th>Ubicación</th><th>M²</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody><tr v-if="huertos.length === 0"><td colspan="7" class="text-center text-muted py-4">No se han registrado huertos todavía.</td></tr><tr v-for="h in huertos" :key="h.ID_Huerto"><td class="fw-bold text-success">{{ h.ID_Huerto }}</td><td>{{ h.Nombre_Cliente }}</td><td>{{ h.Ubicacion }}</td><td>{{ h.Superficie_m2 }} m²</td><td><span class="badge bg-secondary">{{ h.Tipo_Huerto }}</span></td><td><span class="badge bg-success">{{ h.Estado }}</span></td><td><button class="btn btn-sm btn-outline-secondary" @click="editarHuerto(h)">Editar</button></td></tr></tbody></table></div></div></div></div>
</section>

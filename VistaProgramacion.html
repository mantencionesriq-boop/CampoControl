<section v-if="currentTab === 'programacion'" class="row g-4">
  <div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-header bg-success text-white fw-bold">Programar labor</div><div class="card-body"><form @submit.prevent="submitProgramacion">
    <div class="mb-3"><label class="form-label small fw-bold">Huerto</label><select class="form-select" v-model="formProgramacion.ID_Huerto" required><option value="" disabled>Seleccione un huerto</option><option v-for="h in huertos" :value="h.ID_Huerto">{{ h.Nombre_Cliente }}</option></select></div>
    <div class="mb-3"><label class="form-label small fw-bold">Fecha</label><input type="date" class="form-control" v-model="formProgramacion.Fecha_Programada" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Labor</label><select class="form-select" v-model="formProgramacion.Tipo_Labor" required><option v-for="labor in tiposLabor" :value="labor.Nombre">{{ labor.Nombre }}</option><option value="__OTRO__">Otro…</option></select><input v-if="formProgramacion.Tipo_Labor === '__OTRO__'" v-model="otroTipoProgramacion" class="form-control mt-2" required placeholder="Escriba el nuevo tipo de labor"></div>
    <div class="mb-3"><label class="form-label small fw-bold">Horas estimadas</label><input type="number" step="0.5" class="form-control" v-model="formProgramacion.Horas_Estimadas" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Detalle</label><textarea class="form-control" rows="3" v-model="formProgramacion.Descripcion"></textarea></div>
    <button class="btn btn-success w-100" :disabled="submitting">{{ formProgramacion.ID_Programacion ? 'Guardar cambios' : 'Programar labor' }}</button>
  </form></div></div></div>
  <div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold">Calendario de labores</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Fecha</th><th>Huerto</th><th>Labor</th><th>Estado</th><th></th></tr></thead><tbody><tr v-if="laboresProgramadas.length === 0"><td colspan="5" class="text-center text-muted py-4">No hay labores programadas.</td></tr><tr v-for="labor in laboresOrdenadas" :key="labor.ID_Programacion"><td>{{ labor.Fecha_Programada }}</td><td>{{ getHuertoNombre(labor.ID_Huerto) }}</td><td>{{ labor.Tipo_Labor }}</td><td><span class="badge" :class="labor.Estado === 'Realizada' ? 'bg-success' : 'bg-primary'">{{ labor.Estado }}</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary me-1" @click="editarProgramacion(labor)">Editar</button><button v-if="labor.Estado !== 'Realizada'" class="btn btn-sm btn-success" @click="completarProgramacion(labor.ID_Programacion)">Realizada</button></td></tr></tbody></table></div></div></div></div>
</section>

<script>
const { createApp, ref, computed, onMounted } = Vue;

createApp({
  setup() {
    const currentTab = ref('panel');
    const loading = ref(true);
    const submitting = ref(false);
    const panelHuertoId = ref('');
    const huertos = ref([]), culturalLogs = ref([]), fitosanitarioLogs = ref([]), insumos = ref([]);
    const configuraciones = ref([]), laboresProgramadas = ref([]), cultivos = ref([]);
    const alert = ref({ show: false, type: 'success', title: '', message: '' });
    const formHuerto = ref(AppUtils.newHuerto()), formCultural = ref(AppUtils.newCultural()), formFito = ref(AppUtils.newFitosanitario());
    const formProgramacion = ref({ ID_Programacion: '', ID_Huerto: '', Fecha_Programada: AppUtils.today(), Tipo_Labor: '', Descripcion: '', Horas_Estimadas: 1 });
    const formConfiguracion = ref({ ID_Configuracion: '', Categoria: 'LABOR', Nombre: '', Activo: true });
    const formCultivo = ref({ ID_Cultivo: '', ID_Huerto: '', Nombre: '', Activo: true });
    const formInsumo = ref({ ID_Insumo: '', Nombre_Producto: '', Ingrediente_Activo: '', Tipo: '', Via_Aplicacion: '', Dosis_Referencia: '', Precio_Referencia: '', Activo: true });
    const filtroInsumo = ref(''), filtroTipoInsumo = ref(''), filtroViaInsumo = ref('');
    const otroTipoHuerto = ref(''), otroTipoCultural = ref(''), otroProductoFito = ref(''), otroTipoAplicacion = ref(''), otroTipoProgramacion = ref('');
    const tiposLabor = computed(() => configuraciones.value.filter(x => x.Categoria === 'LABOR' && x.Activo));
    const tiposHuerto = computed(() => configuraciones.value.filter(x => x.Categoria === 'TIPO_HUERTO' && x.Activo));
    const tiposAplicacion = computed(() => configuraciones.value.filter(x => x.Categoria === 'TIPO_APLICACION' && x.Activo));
    const productosAplicados = computed(() => configuraciones.value.filter(x => x.Categoria === 'PRODUCTO' && x.Activo));
    const cultivosDelHuerto = computed(() => cultivos.value.filter(x => x.ID_Huerto === formCultivo.value.ID_Huerto && (x.Activo === true || x.Activo === 'TRUE')));
    const cultivosDelHuertoProgramado = computed(() => cultivos.value.filter(x => x.ID_Huerto === formProgramacion.value.ID_Huerto && (x.Activo === true || x.Activo === 'TRUE')));
    const insumosFiltrados = computed(() => insumos.value.filter(item => (String(item.Nombre_Producto || '') + ' ' + String(item.Ingrediente_Activo || '')).toLowerCase().includes(filtroInsumo.value.toLowerCase()) && String(item.Tipo || '').toLowerCase().includes(filtroTipoInsumo.value.toLowerCase()) && String(item.Via_Aplicacion || '').toLowerCase().includes(filtroViaInsumo.value.toLowerCase())));
    const superficieHuertoSeleccionado = computed(() => {
      const huerto = huertos.value.find(item => item.ID_Huerto === formFito.value.ID_Huerto);
      if (!huerto) return null;
      const superficie = Number(String(huerto.Superficie_m2).replace(',', '.'));
      return Number.isFinite(superficie) && superficie > 0 ? superficie : null;
    });
    const culturalHistorial = computed(() => culturalLogs.value.filter(item => String(item.Fecha) <= AppUtils.today()));
    const calendarioLabores = computed(() => {
      const programadas = laboresProgramadas.value.map(item => ({ ...item, clave: 'PRG-' + item.ID_Programacion, origen: 'PROGRAMADA' }));
      const culturalesFuturas = culturalLogs.value
        .filter(item => String(item.Fecha) > AppUtils.today())
        .map(item => ({ ...item, clave: 'LAB-' + item.ID_Labor, origen: 'CULTURAL', Fecha_Programada: item.Fecha, Estado: 'Registrada' }));
      const aplicaciones = fitosanitarioLogs.value
        .map(item => ({ ...item, clave: 'FIT-' + item.ID_Aplicacion, origen: 'FITOSANITARIO', Fecha_Programada: item.Fecha, Tipo_Labor: (item.Tipo_Aplicacion || 'Aplicación') + ': ' + item.Producto_Aplicado, Estado: 'Aplicación registrada' }));
      return [...programadas, ...culturalesFuturas, ...aplicaciones].sort((a, b) => String(a.Fecha_Programada).localeCompare(String(b.Fecha_Programada)));
    });
    const filtrarPorPanel = items => panelHuertoId.value ? items.filter(item => item.ID_Huerto === panelHuertoId.value) : items;
    const aplicacionesPanel = computed(() => filtrarPorPanel(fitosanitarioLogs.value));
    const laboresProgramadasPanel = computed(() => filtrarPorPanel(laboresProgramadas.value));
    const laboresCulturalesPanel = computed(() => filtrarPorPanel(culturalLogs.value));
    const laboresRealizadas = computed(() => laboresProgramadasPanel.value.filter(x => x.Estado === 'Realizada').length);
    const laboresPendientes = computed(() => laboresProgramadasPanel.value.filter(x => x.Estado !== 'Realizada').length);
    const fertilizacionesRealizadas = computed(() => laboresCulturalesPanel.value.filter(x => x.Tipo_Labor === 'Fertilización').length);

    const showAlert = (title, message, type = 'success') => { alert.value = { show: true, title, message, type }; setTimeout(() => { alert.value.show = false; }, 5000); };
    const getHuertoNombre = id => (huertos.value.find(x => x.ID_Huerto === id) || {}).Nombre_Cliente || id;
    const getCultivoNombre = id => id ? ((cultivos.value.find(x => x.ID_Cultivo === id) || {}).Nombre || '—') : '—';
    const renderDashboard = () => {
      const canvas = document.getElementById('canvasResumen');
      if (!canvas) return;
      const ctx = canvas.getContext('2d'), data = [
        ['Aplicaciones', aplicacionesPanel.value.length, '#dc3545'], ['Fertilizaciones', fertilizacionesRealizadas.value, '#198754'], ['Programadas realizadas', laboresRealizadas.value, '#0d6efd']
      ], width = canvas.clientWidth, height = 220, max = Math.max(1, ...data.map(x => x[1]));
      canvas.width = width; canvas.height = height; ctx.clearRect(0, 0, width, height);
      data.forEach((item, index) => { const x = 35 + index * (width / 3), barHeight = item[1] / max * 130; ctx.fillStyle = item[2]; ctx.fillRect(x, 165 - barHeight, 95, barHeight); ctx.fillStyle = '#212529'; ctx.font = '13px Segoe UI'; ctx.fillText(String(item[1]), x + 40, 155 - barHeight); ctx.fillText(item[0], x, 192); });
    };
    const openTab = tab => { currentTab.value = tab; if (tab === 'panel') setTimeout(renderDashboard, 0); };
    const loadServerData = async () => {
      loading.value = true;
      try {
        const response = await ServerApi.call('getInitialData');
        if (!response.success) throw new Error(response.error);
        huertos.value = response.huertos; culturalLogs.value = response.culturalLogs; fitosanitarioLogs.value = response.fitosanitarioLogs; insumos.value = response.insumos;
        configuraciones.value = response.configuraciones; laboresProgramadas.value = response.laboresProgramadas; cultivos.value = response.cultivos || [];
        if (!formProgramacion.value.Tipo_Labor && tiposLabor.value[0]) formProgramacion.value.Tipo_Labor = tiposLabor.value[0].Nombre;
        setTimeout(renderDashboard, 0);
      } catch (error) { showAlert('Error del servidor', error.message || error.toString(), 'danger'); }
      finally { loading.value = false; }
    };
    const submit = async (method, form, reset) => {
      submitting.value = true;
      try { const response = await ServerApi.call(method, form.value); if (!response.success) throw new Error(response.error); showAlert('¡Éxito!', response.message); form.value = reset(); await loadServerData(); }
      catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); }
      finally { submitting.value = false; }
    };
    const saveOtherOption = async (form, field, category, otherOption) => {
      if (form.value[field] !== '__OTRO__') return true;
      const name = otherOption.value.trim();
      if (!name) throw new Error('Escriba el nombre de la nueva opción.');
      const response = await ServerApi.call('saveConfiguracion', { Categoria: category, Nombre: name, Activo: true });
      if (!response.success) throw new Error(response.error);
      form.value[field] = name;
      otherOption.value = '';
      return true;
    };
    const submitHuerto = async () => { try { await saveOtherOption(formHuerto, 'Tipo_Huerto', 'TIPO_HUERTO', otroTipoHuerto); await submit(formHuerto.value.ID_Huerto ? 'updateHuerto' : 'addHuerto', formHuerto, AppUtils.newHuerto.bind(AppUtils)); } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); } };
    const submitCultural = async () => { try { await saveOtherOption(formCultural, 'Tipo_Labor', 'LABOR', otroTipoCultural); await submit(formCultural.value.ID_Labor ? 'updateBitacoraCultural' : 'addBitacoraCultural', formCultural, AppUtils.newCultural.bind(AppUtils)); } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); } };
    const submitFitosanitario = async () => { try { if (superficieHuertoSeleccionado.value !== null && Number(formFito.value.Superficie_Tratada_m2) > superficieHuertoSeleccionado.value) throw new Error('La superficie tratada no puede superar los ' + superficieHuertoSeleccionado.value + ' m² del huerto.'); await saveOtherOption(formFito, 'Tipo_Aplicacion', 'TIPO_APLICACION', otroTipoAplicacion); await saveOtherOption(formFito, 'Producto_Aplicado', 'PRODUCTO', otroProductoFito); await submit(formFito.value.ID_Aplicacion ? 'updateBitacoraFitosanitaria' : 'addBitacoraFitosanitaria', formFito, AppUtils.newFitosanitario.bind(AppUtils)); } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); } };
    const submitProgramacion = async () => { try { await saveOtherOption(formProgramacion, 'Tipo_Labor', 'LABOR', otroTipoProgramacion); await submit('saveLaborProgramada', formProgramacion, () => ({ ID_Programacion: '', ID_Huerto: '', ID_Cultivo: '', Fecha_Programada: AppUtils.today(), Tipo_Labor: tiposLabor.value[0] ? tiposLabor.value[0].Nombre : '', Descripcion: '', Horas_Estimadas: 1 })); } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); } };
    const submitConfiguracion = () => submit('saveConfiguracion', formConfiguracion, () => ({ ID_Configuracion: '', Categoria: 'LABOR', Nombre: '', Activo: true }));
    const editarProgramacion = record => { formProgramacion.value = { ...record }; };
    const editarConfiguracion = record => { formConfiguracion.value = { ...record, Activo: record.Activo === true || record.Activo === 'TRUE' }; };
    const submitCultivo = () => submit('saveCultivo', formCultivo, () => ({ ID_Cultivo: '', ID_Huerto: formCultivo.value.ID_Huerto, Nombre: '', Activo: true }));
    const eliminarCultivo = async id => { if (!window.confirm('¿Eliminar este cultivo?')) return; await eliminarLabor('deleteCultivo', id); };
    const submitInsumo = () => submit('saveInsumo', formInsumo, () => ({ ID_Insumo: '', Nombre_Producto: '', Ingrediente_Activo: '', Tipo: '', Via_Aplicacion: '', Dosis_Referencia: '', Precio_Referencia: '', Activo: true }));
    const editarInsumo = item => { formInsumo.value = { ...item, Activo: item.Activo === true || item.Activo === 'TRUE' }; };
    const eliminarInsumo = async id => { if (!window.confirm('¿Eliminar este producto?')) return; await eliminarLabor('deleteInsumo', id); };
    const exportarInsumosCsv = () => { const headers = ['Nombre_Producto','Ingrediente_Activo','Tipo','Via_Aplicacion','Dosis_Referencia','Precio_Referencia','Activo']; const csv = [headers.join(','), ...insumos.value.map(item => headers.map(h => '"' + String(item[h] || '').replace(/"/g, '""') + '"').join(','))].join('\n'); const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); const link = document.createElement('a'); link.href = url; link.download = 'catalogo-tecnico.csv'; link.click(); URL.revokeObjectURL(url); };
    const importarInsumosCsv = async event => { const file = event.target.files[0]; if (!file) return; try { const lines = (await file.text()).replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean); const headers = lines.shift().split(',').map(x => x.trim().replace(/^"|"$/g, '')); const rows = lines.map(line => { const values = line.match(/(?:^|,)(?:"([^"]*(?:""[^"]*)*)"|([^",]*))/g).map(x => x.replace(/^,/, '').replace(/^"|"$/g, '').replace(/""/g, '"')); return headers.reduce((obj, h, i) => { obj[h] = values[i] || ''; return obj; }, {}); }); const response = await ServerApi.call('importInsumos', rows); if (!response.success) throw new Error(response.error); showAlert('Importación completada', response.message); await loadServerData(); } catch (error) { showAlert('Error de importación', error.message || error.toString(), 'danger'); } finally { event.target.value = ''; } };
    const editarHuerto = record => { formHuerto.value = { ...record }; window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const editarCultural = record => { formCultural.value = { ...record }; window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const editarFitosanitario = record => { formFito.value = { ...record }; window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const eliminarCultural = async id => {
      if (!window.confirm('¿Eliminar esta labor del historial? Esta acción no se puede deshacer.')) return;
      await eliminarLabor('deleteBitacoraCultural', id);
    };
    const eliminarLabor = async (method, id) => {
      submitting.value = true;
      try {
        const response = await ServerApi.call(method, id);
        if (!response.success) throw new Error(response.error);
        showAlert('Labor eliminada', response.message);
        await loadServerData();
      } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); }
      finally { submitting.value = false; }
    };
    const editarLaborCalendario = labor => {
      if (labor.origen === 'PROGRAMADA') editarProgramacion(labor);
      else if (labor.origen === 'CULTURAL') { openTab('cultural'); editarCultural(labor); }
      else { openTab('fitosanitario'); editarFitosanitario(labor); }
    };
    const eliminarLaborCalendario = labor => {
      if (!window.confirm('¿Eliminar esta labor? Esta acción no se puede deshacer.')) return;
      const method = labor.origen === 'PROGRAMADA' ? 'deleteLaborProgramada' : labor.origen === 'CULTURAL' ? 'deleteBitacoraCultural' : 'deleteBitacoraFitosanitaria';
      const id = labor.origen === 'PROGRAMADA' ? labor.ID_Programacion : labor.origen === 'CULTURAL' ? labor.ID_Labor : labor.ID_Aplicacion;
      return eliminarLabor(method, id);
    };
    const completarProgramacion = async id => { submitting.value = true; try { const response = await ServerApi.call('completeLaborProgramada', id); if (!response.success) throw new Error(response.error); showAlert('Labor realizada', response.message); await loadServerData(); } catch (error) { showAlert('Error', error.message || error.toString(), 'danger'); } finally { submitting.value = false; } };
    onMounted(loadServerData);
    return { currentTab, loading, submitting, panelHuertoId, huertos, culturalLogs, culturalHistorial, fitosanitarioLogs, aplicacionesPanel, insumos, configuraciones, laboresProgramadas, cultivos, calendarioLabores, formHuerto, formCultural, formFito, formProgramacion, formConfiguracion, formCultivo, formInsumo, filtroInsumo, filtroTipoInsumo, filtroViaInsumo, otroTipoHuerto, otroTipoCultural, otroProductoFito, otroTipoAplicacion, otroTipoProgramacion, tiposHuerto, tiposAplicacion, tiposLabor, productosAplicados, cultivosDelHuerto, cultivosDelHuertoProgramado, insumosFiltrados, superficieHuertoSeleccionado, laboresRealizadas, laboresPendientes, fertilizacionesRealizadas, alert, getHuertoNombre, getCultivoNombre, renderDashboard, loadServerData, openTab, submitHuerto, submitCultural, submitFitosanitario, submitProgramacion, submitConfiguracion, submitCultivo, eliminarCultivo, submitInsumo, editarInsumo, eliminarInsumo, exportarInsumosCsv, importarInsumosCsv, editarProgramacion, editarConfiguracion, editarHuerto, editarCultural, editarFitosanitario, editarLaborCalendario, eliminarCultural, eliminarLaborCalendario, completarProgramacion };
  }
}).mount('#app');
</script>

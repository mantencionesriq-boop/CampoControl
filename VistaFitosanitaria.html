<section v-if="currentTab === 'fitosanitario'" class="row g-4">
  <div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-header bg-warning text-dark fw-bold"><i class="bi bi-bug me-1"></i> Registro Fitosanitario</div><div class="card-body"><form @submit.prevent="submitFitosanitario">
    <div class="mb-3"><label class="form-label small fw-bold">Huerto / Cliente</label><select class="form-select" v-model="formFito.ID_Huerto" required><option value="" disabled>Seleccione un huerto</option><option v-for="h in huertos" :value="h.ID_Huerto" :key="h.ID_Huerto">{{ h.Nombre_Cliente }} ({{ h.ID_Huerto }})</option></select></div>
    <div class="mb-3"><label class="form-label small fw-bold">Fecha de Aplicación</label><input type="date" class="form-control" v-model="formFito.Fecha" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Problema Objetivo</label><input type="text" class="form-control" v-model="formFito.Problema_Objetivo" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Producto Aplicado</label><select class="form-select" v-model="formFito.Producto_Aplicado" required><option v-for="producto in productosAplicados" :value="producto.Nombre">{{ producto.Nombre }}</option><option value="__OTRO__">Otro…</option></select><input v-if="formFito.Producto_Aplicado === '__OTRO__'" v-model="otroProductoFito" class="form-control mt-2" required placeholder="Escriba el producto aplicado"></div>
    <div class="mb-3"><label class="form-label small fw-bold">Dosis Utilizada</label><input type="text" class="form-control" v-model="formFito.Dosis_Utilizada" required></div>
    <div class="mb-3"><label class="form-label small fw-bold">Eficacia Observada / Estado</label><select class="form-select" v-model="formFito.Eficacia_Observada" required><option>En Seguimiento</option><option>Control Alto</option><option>Control Medio</option><option>Sin Respuesta</option></select></div>
    <button type="submit" class="btn btn-success w-100 fw-bold" :disabled="submitting"><span v-if="submitting" class="spinner-border spinner-border-sm me-1"></span>{{ formFito.ID_Aplicacion ? 'Guardar cambios' : 'Registrar aplicación' }}</button>
  </form></div></div></div>
    <div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold"><i class="bi bi-shield-check me-1"></i> Historial Fitosanitario</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Fecha</th><th>Huerto</th><th>Problema</th><th>Producto</th><th>Dosis</th><th>Eficacia</th><th></th></tr></thead><tbody><tr v-if="fitosanitarioLogs.length === 0"><td colspan="7" class="text-center text-muted py-4">No hay tratamientos fitosanitarios registrados.</td></tr><tr v-for="f in fitosanitarioLogs" :key="f.ID_Aplicacion"><td>{{ f.Fecha }}</td><td class="fw-bold">{{ getHuertoNombre(f.ID_Huerto) }}</td><td><span class="badge bg-danger">{{ f.Problema_Objetivo }}</span></td><td>{{ f.Producto_Aplicado }}</td><td class="small">{{ f.Dosis_Utilizada }}</td><td><span class="badge bg-warning text-dark">{{ f.Eficacia_Observada }}</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary me-1" @click="editarFitosanitario(f)">Editar</button><button class="btn btn-sm btn-outline-danger" @click="eliminarFitosanitario(f.ID_Aplicacion)">Eliminar</button></td></tr></tbody></table></div></div></div></div>
</section>

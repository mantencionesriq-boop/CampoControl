<section v-if="currentTab === 'configuracion'" class="row g-4">
  <div class="col-md-4"><div class="card shadow-sm border-0"><div class="card-header bg-dark text-white fw-bold">Catálogos</div><div class="card-body"><form @submit.prevent="submitConfiguracion">
    <div class="mb-3"><label class="form-label small fw-bold">Categoría</label><select class="form-select" v-model="formConfiguracion.Categoria" required><option value="LABOR">Tipo de labor</option><option value="PRODUCTO">Producto aplicado</option></select></div>
    <div class="mb-3"><label class="form-label small fw-bold">Nombre</label><input class="form-control" v-model="formConfiguracion.Nombre" required></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" v-model="formConfiguracion.Activo" id="activo"><label class="form-check-label" for="activo">Activo</label></div>
    <button class="btn btn-dark w-100" :disabled="submitting">{{ formConfiguracion.ID_Configuracion ? 'Guardar cambios' : 'Agregar' }}</button>
  </form></div></div></div>
  <div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold">Tipos de labores y productos aplicados</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>Categoría</th><th>Nombre</th><th>Activo</th><th></th></tr></thead><tbody><tr v-for="item in configuraciones" :key="item.ID_Configuracion"><td>{{ item.Categoria }}</td><td>{{ item.Nombre }}</td><td>{{ item.Activo ? 'Sí' : 'No' }}</td><td class="text-end"><button class="btn btn-sm btn-outline-secondary" @click="editarConfiguracion(item)">Editar</button></td></tr></tbody></table></div></div></div></div>
</section>

<section v-if="currentTab === 'configuracion'">
  <div class="module-toolbar"><div><strong>Catálogos operativos</strong><span>Labores, productos y cultivos</span></div><button class="btn btn-success" @click="nuevaConfiguracion"><i class="bi bi-plus-lg me-1"></i>Nueva opción</button></div>
  <div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Categoría</th><th>Nombre</th><th>Activo</th></tr></thead><tbody><tr v-for="item in configuraciones" :key="item.ID_Configuracion" class="clickable-row" @click="editarConfiguracion(item)"><td><span class="badge bg-secondary">{{ item.Categoria }}</span></td><td class="fw-semibold">{{ item.Nombre }}</td><td>{{ item.Activo ? 'Sí' : 'No' }}</td></tr></tbody></table></div></div>
  <div v-if="activeDrawer === 'configuracion'" class="drawer-layer" @click.self="closeDrawer"><aside class="form-drawer"><div class="drawer-head"><div><span>Configuración</span><h2>{{ formConfiguracion.ID_Configuracion ? 'Editar opción' : 'Nueva opción' }}</h2></div><button class="icon-button" @click="closeDrawer"><i class="bi bi-x-lg"></i></button></div><form class="drawer-body" @submit.prevent="submitConfiguracion"><div class="mb-3"><label class="form-label">Categoría</label><select class="form-select" v-model="formConfiguracion.Categoria" required><option value="LABOR">Tipo de labor</option><option value="PRODUCTO">Producto aplicado</option><option value="CULTIVO">Cultivo, arbusto o sector</option></select></div><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" v-model="formConfiguracion.Nombre" required></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" v-model="formConfiguracion.Activo" id="activo"><label class="form-check-label" for="activo">Opción activa</label></div><div class="drawer-actions"><button type="button" class="btn btn-light" @click="closeDrawer">Cancelar</button><button class="btn btn-success" :disabled="submitting">Guardar</button></div></form></aside></div>
</section>
